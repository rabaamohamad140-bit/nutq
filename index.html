<style>
:root{--bg:#F3F1FA;--surface:#fff;--text:#23215E;--muted:#6B6A93;--accent:#FF8A3D;--on-accent:#2A1500;--danger:#BF3636;--success:#16724D;--line:#DEDAF2;--soft:#E9E6F7;--ok-bg:#DDF3E8;--bad-bg:#FBE3E3}
:root[data-theme=dark]{--bg:#15143A;--surface:#201F52;--text:#F1EFFF;--muted:#A9A7D6;--danger:#FF8F8F;--success:#6FE0AC;--line:#34336E;--soft:#2A2962;--ok-bg:#12402F;--bad-bg:#4A2430}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
#top .brand{white-space:nowrap;font-weight:800;font-size:18px;margin-inline-end:auto;display:flex;gap:6px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.icon{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:17px}
main{max-width:640px;margin:0 auto;padding:16px 16px 120px}
main.wide{max-width:960px}
h1{font-size:24px;margin:8px 0 12px}h2{font-size:18px;margin:20px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:14px;padding:12px 20px;min-height:48px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sec{background:var(--soft);color:var(--text);box-shadow:none}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 8px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:6px}
.langs .flag{font-size:38px}
.langs small{color:var(--muted);font-weight:600}
nav#nav{gap:6px;justify-content:center!important;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav#nav button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 8px;border-radius:12px;min-width:56px}
nav#nav button b{font-size:21px;font-weight:400}
nav#nav button.on{color:var(--text);background:var(--soft)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:14px;text-align:center;line-height:1.1}
.row{display:flex;gap:14px;align-items:center}
.lvl{font-size:12px;font-weight:800;color:var(--muted);margin:18px 0 6px;letter-spacing:.5px}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.unit .n{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none}
.unit.done .n{background:var(--accent);color:var(--on-accent)}
.unit.rec{outline:3px solid var(--accent)}
.unit .t{flex:1;font-weight:700}.unit .s{color:var(--accent);letter-spacing:2px;white-space:nowrap}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.q .big{font-size:84px;text-align:center;line-height:1.1;margin:14px 0}
.q .word{font-size:30px;font-weight:800;text-align:center;margin:14px 0}
.q .sub{text-align:center;color:var(--muted);margin:0 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:700;font-size:18px;min-height:64px;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere}
.opt.emo{font-size:40px}
.opt.good{border-color:var(--success);background:var(--ok-bg);color:var(--success)}
.opt.bad{border-color:var(--danger);background:var(--bad-bg);color:var(--danger)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.gone{visibility:hidden}
.opt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
input.ans{width:100%;font:inherit;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);text-align:center;direction:ltr}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- state ---------- */
function def(){return{lang:null,xp:0,streak:0,last:'',dayXp:0,day:'',prog:{},weak:{},rec:{},exam:{},st:{ans:0,ok:0,best:0,perfect:0,sent:0,match:0,exams:0,stars3:0,learned:0,lexam:0},ach:{},dark:null,mute:false,gift:'',dv:DV}}
const DV=6;
function remap(s,m){
  if(s.prog)for(const l in s.prog){const o=s.prog[l],n={};for(const u in o)n[m(+u)]=o[u];s.prog[l]=n}
  if(s.weak)for(const l in s.weak){const o=s.weak[l],n={};for(const k in o){const p=k.split('_');n[m(+p[0])+'_'+p[1]]=o[k]}s.weak[l]=n}
  if(s.rec)for(const l in s.rec)if(typeof s.rec[l]==='number')s.rec[l]=m(s.rec[l])}
function migrate(s){/* each data version appends new units at the end of every level, so old progress moves to its new index */
  if(!s.dv){remap(s,u=>Math.floor(u/7)*15+u%7);s.dv=2}
  if(s.dv===2){remap(s,u=>Math.floor(u/15)*25+u%15);s.dv=3}
  if(s.dv===3){remap(s,u=>Math.floor(u/25)*33+u%25);s.dv=4}
  if(s.dv===4){remap(s,u=>Math.floor(u/33)*34+u%33);s.dv=5}
  if(s.dv===5){remap(s,u=>Math.floor(u/34)*36+u%34);s.dv=6}
  s.dv=DV}
function load(){try{const s=JSON.parse(localStorage.getItem('lisan_v2'));if(s){if(s.dv!==DV)migrate(s);return Object.assign(def(),s,{st:Object.assign(def().st,s.st||{})})}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem('lisan_v2',JSON.stringify(S))}catch(e){}}
const li=()=>LANGS.findIndex(l=>l.id===S.lang);
const L=()=>LANGS[li()];
const level=()=>Math.floor(S.xp/100)+1;
function prog(u){S.prog[S.lang]=S.prog[S.lang]||{};return S.prog[S.lang][u]=S.prog[S.lang][u]||{stars:0,learned:false}}
function W(l,u,i){const r=UNITS[u].w[i];return{k:u+'_'+i,u,i,e:r[0],ar:r[1],t:r[2+l]}}
function wordsOf(l,u){const out=[];for(let a=0;a<UNITS.length;a++){if(u!==undefined&&a!==u)continue;for(let i=0;i<UNITS[a].w.length;i++)out.push(W(l,a,i))}return out}

/* ---------- audio ---------- */
let toastT;
function toast(m){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600)}
function speak(t,code){
  if(S.mute)return;
  try{
    if('speechSynthesis' in window){
      const vs=speechSynthesis.getVoices();
      if(vs.some(v=>v.lang.toLowerCase().replace('_','-').startsWith(code.slice(0,2)))){
        speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=code;u.rate=.85;speechSynthesis.speak(u);return;
      }
    }
  }catch(e){}
  try{ // fallback: unofficial online voice, may be blocked or stop working
    const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q='+encodeURIComponent(t)+'&tl='+code.slice(0,2));
    a.play().catch(()=>toast('لا يوجد صوت متاح لهذه اللغة على جهازك'));
  }catch(e){toast('لا يوجد صوت متاح لهذه اللغة على جهازك')}
}
function say(t){speak(t,L().code)}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i').replace(/ß/g,'ss').replace(/œ/g,'oe').replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim()}

function checkAch(){ACH.forEach((a,i)=>{if(!S.ach[i]&&a[3](S)){S.ach[i]=today();toast('🏆 إنجاز جديد: '+a[1])}})}
function earn(n){
  const t=today();
  if(S.day!==t){S.day=t;S.dayXp=0}
  if(S.last!==t){S.streak=(S.last===yest())?S.streak+1:1;S.last=t}
  const lv0=level();S.xp+=n;S.dayXp+=n;checkAch();checkQ();if(level()>lv0){toast('🚀 مستوى جديد: '+level()+' — '+rankOf(level()));confetti(70)}save();topbar();
}

const LVD=[['مبتدئ','تفهم وتستخدم عبارات يومية بسيطة: تعرّف بنفسك، تسأل وتجيب عن أمور شخصية أساسية.'],
['أساسي','تتواصل في مواقف مألوفة: تسوّق، عمل، عائلة، وتصف محيطك بجمل بسيطة.'],

['فوق المتوسط','تفهم النصوص المعقّدة وتتحاور بطلاقة وعفوية مع ناطقين أصليين.'],
['متقدّم','تعبّر عن نفسك بسلاسة ودقة وتفهم نصوصاً طويلة ومضمرة المعنى.'],
['إتقان','تفهم كل ما تسمعه أو تقرؤه تقريباً وتعبّر بدقة دقيقة حتى في المواقف المعقّدة.']];
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const old=$('#cf');if(old)old.remove();
  const c=document.createElement('canvas');c.id='cf';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#FF8A3D','#FFD08A','#8A6BF0','#4CC9A0','#FF6B8B','#5BA8FF'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols)}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++f<150)requestAnimationFrame(step);else c.remove()})();
}

  return[['🎯','أجب 10 إجابات صحيحة',S.st.ok-S.qd.ok,10],['📖','أكمل بطاقات وحدة',(S.st.lc||0)-S.qd.lc,1],['⭐','اجمع 50 نقطة',dx,50]];
}

/* ---------- questions ---------- */
function distract(w,l,n,key){
  const seen=new Set([key(w)]),out=[];
  const same=shuffle(wordsOf(l,w.u)),other=shuffle(wordsOf(l)).slice(0,60);
  for(const x of same.concat(other)){const k=key(x);if(!seen.has(k)){seen.add(k);out.push(x);if(out.length>=n)break}}
  return out;
}
function mkQ(w,l,type){
  if(type==='p2w'){const o=shuffle([w,...distract(w,l,3,x=>x.t.toLowerCase())]);
    return{kind:'choice',w,sound:false,prompt:`<div class="sub">ما معنى هذه الصورة؟</div><div class="big">${w.e}</div>`,opts:o.map(x=>({v:x.k,html:`<span class="ltr">${x.t}</span>`})),ans:w.k,show:w.t}}
  if(type==='w2p'){const o=shuffle([w,...distract(w,l,3,x=>x.e)]);
    return{kind:'choice',w,speak:w.t,prompt:`<div class="sub">اختر الصورة المناسبة</div><div class="word ltr">${w.t}</div>`,opts:o.map(x=>({v:x.k,html:x.e,emo:1})),ans:w.k,show:w.t}}
  if(type==='listen'){const o=shuffle([w,...distract(w,l,3,x=>x.t.toLowerCase())]);
    return{kind:'choice',w,speak:w.t,auto:true,prompt:`<div class="sub">استمع واختر الكلمة الصحيحة</div><div style="text-align:center"><button class="btn sec" data-rep>🔊 أعد الاستماع</button></div>`,opts:o.map(x=>({v:x.k,html:`<span class="ltr">${x.t}</span>`})),ans:w.k,show:w.t}}
  return{kind:'type',w,prompt:`<div class="sub">اكتب الكلمة بـ${L().name}</div><div class="big">${w.e}</div><div class="word">${w.ar}</div>`,ans:w.t,show:w.t};
}
const TYPES=['p2w','w2p','listen','type'];
function setFor(u,n,types){const l=li(),ws=shuffle(wordsOf(l,u));const out=[];for(let i=0;i<n;i++)out.push(mkQ(ws[i%ws.length],l,types[i%types.length]));return out}
function startPractice(u){const qs=setFor(u,Math.min(12,Math.max(8,UNITS[u].w.length)),shuffle(TYPES));runSession({title:'تدريب: '+UNITS[u].t,qs,retry:()=>startPractice(u),onDone:r=>{earn(10);r.done()}})}
function startExam(u){
  const qs=shuffle(setFor(u,12,TYPES));
  runSession({title:'امتحان: '+UNITS[u].t,qs,isExam:true,retry:()=>startExam(u),onDone:r=>{
    const pct=Math.round(r.ok/r.total*100),pass=pct>=70,stars=pass?(pct===100?3:pct>=85?2:1):0;
    S.st.exams++;if(pct===100)S.st.perfect++;
    if(pass){const p=prog(u);const first=!p.stars;if(stars>p.stars){p.stars=stars}if(stars===3)S.st.stars3++;earn(first?20:5)}else save();
    r.done(`<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p><b>${pass?'نجحت! 🎉':'ما وصلت لـ70%'}</b> (${pct}%)</p><p class="muted">${pass?'':'راجع البطاقات وجرّب مرة ثانية.'}</p>`);
  }});
}
const FOX_OK=['ممتاز!','أحسنت!','شاطر! 🔥','تمام!','صح عليك!'],FOX_BAD=['ولا يهمك، كمّل!','المرة الجاية أحسن','انتبه للتفاصيل'];
function recWeak(w,ok){
  S.st.ans++;const wk=S.weak[S.lang]=S.weak[S.lang]||{};
  if(ok){S.st.ok++;if(wk[w.k]){wk[w.k]--;if(wk[w.k]<=0)delete wk[w.k]}}else wk[w.k]=(wk[w.k]||0)+2;
}
/* generic runner */
function runSession({title,qs,onDone,timed,retry,isExam}){
  navbar(false);pushSub();let i=0,ok=0,combo=0,over=false,timer=null,left=timed||0;const results=[];
  const total=qs.length;
  cleanup=()=>{over=true;clearInterval(timer)};
  function finish(){
    over=true;clearInterval(timer);const fb=$('.fb');if(fb)fb.remove();
    onDone({ok,results,total:timed?i:total,qsDone:i,done:(extra)=>{
      checkAch();save();topbar();if(ok/(timed?Math.max(i,1):total)>=.7)confetti();
      app.innerHTML=`<div class="card res"><div class="big">${ok/(timed?Math.max(i,1):total)>=.7?'🦊🎉':'🦊'}</div><h1>${title}</h1>${extra||''}<p>النتيجة: <b>${ok}</b> ${timed?'إجابة صحيحة':'من '+total}</p><button class="btn block" id="back">متابعة</button>${retry?'<button class="btn sec block" id="again" style="margin-top:10px">🔁 إعادة</button>':''}</div>`;
      $('#back').onclick=()=>{cleanup=null;goBack()};if(retry)$('#again').onclick=()=>{history.replaceState(null,'');retry()}}});
  }
  function show(){
    if(over)return;
    if(i>=qs.length)return finish();
    const q=qs[i];
    app.innerHTML=`<div class="top2"><button class="back" id="qx" aria-label="رجوع">→ رجوع</button><div class="bar" style="flex:1"><i style="width:${timed?left/timed*100:i/total*100}%"></i></div>${timed?`<b>${left}s</b>`:''}</div>
    <div class="fox"><span class="f">🦊</span><span class="bub" id="bub">${q.kind==='type'?'اكتب الجواب':'اختر الجواب'}</span>${combo>1?`<span class="combo">🔥 كومبو ×${combo}</span>`:''}</div>
    <div class="card q">${q.prompt}${q.kind==='choice'?`<div class="opts">${q.opts.map(o=>`<button class="opt ${o.emo?'emo':''}" data-v="${o.v}">${o.html}</button>`).join('')}</div>`:`<input class="ans" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false"><div style="margin-top:12px"><button class="btn block" id="chk">تحقّق</button></div>`}</div>`;
    $('#qx').onclick=()=>{if(isExam&&i>0&&!over&&!confirm('تخرج من الامتحان؟ ما رح يُحسب.'))return;goBack()};
    const rep=$('[data-rep]');if(rep)rep.onclick=()=>say(q.speak);
    if(q.auto)setTimeout(()=>say(q.speak),250);else if(q.speak&&q.kind==='choice')say(q.speak);
    if(q.kind==='choice')app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v===q.ans,b));
    else{const inp=$('#inp');inp.focus();const go=()=>answer(norm(inp.value)===norm(q.ans)&&inp.value.trim()!=='');$('#chk').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
  }
  function answer(good,btn){
    if(over)return;
    const q=qs[i];let locked=app.dataset.lock==='1';if(locked)return;app.dataset.lock='1';
    recWeak(q.w,good);results.push(good);
    if(good){ok++;combo++;earn(3)}else combo=0;
    if(q.kind==='choice'){app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.v===q.ans)b.classList.add('good');else if(b===btn)b.classList.add('bad')})}
    else{const inp=$('#inp');inp.disabled=true;inp.style.borderColor=good?'var(--success)':'var(--danger)';$('#chk').disabled=true}
    $('#bub').textContent=good?pick(FOX_OK):pick(FOX_BAD);
    const next=()=>{app.dataset.lock='0';const fb=$('.fb');if(fb)fb.remove();i++;show()};
    if(timed){setTimeout(()=>{if(!over)next()},good?350:700);return}
    const fb=document.createElement('div');fb.className='fb '+(good?'good':'bad');
    fb.innerHTML=`<div class="in"><div><b>${good?'✓ إجابة صحيحة':'✗ غير صحيحة'}</b>${good?'':`<div class="ans-t">الجواب: <b class="ltr">${q.show}</b></div>`}</div><button class="btn" id="nx">متابعة</button></div>`;
    document.body.appendChild(fb);$('#nx').focus();$('#nx').onclick=next;
  }
  app.dataset.lock='0';
  if(timed){timer=setInterval(()=>{left--;const b=$('.top2 b');if(b)b.textContent=left+'s';const bar=$('.top2 .bar i');if(bar)bar.style.width=left/timed*100+'%';if(left<=0&&!over){finish()}},1000)}
  show();
}

/* ---------- big exams (levels, sentences, final) ---------- */
function examStore(key,pct){
  const pass=pct>=70,ex=S.exam[S.lang]=S.exam[S.lang]||{},old=ex[key];
  const first=!(old&&old.pass);
  ex[key]={best:Math.max(pct,old?old.best:0),pass:pass||(old&&old.pass)||false};
  if(pass){if(first){earn(40);if(key!=='sent')S.st.lexam++}else earn(10)}
  S.st.exams++;if(pct===100)S.st.perfect++;checkAch();save();topbar();
  return `<p><b>${pass?'نجحت! 🎉':'ما وصلت لـ70%'}</b> (${pct}%)</p>${pass&&first?'<p>+40 نقطة على أول نجاح</p>':''}<p class="muted">${pass?'':'راجع الوحدات وجرّب مرة ثانية.'}</p>`;
}
function bigExam(key,title,mk){
  runSession({title,qs:mk(),isExam:true,retry:()=>bigExam(key,title,mk),onDone:r=>{r.done(examStore(key,Math.round(r.ok/r.total*100)))}});
}
function levelExam(g){
  const l=li();
  bigExam('L'+g,'امتحان المستوى '+LVN[g],()=>shuffle(wordsOf(l).filter(w=>w.u>=g*UPL&&w.u<g*UPL+UPL)).slice(0,20).map((w,j)=>mkQ(w,l,TYPES[j%4])));
}
function finalExam(){
  const l=li();
  bigExam('final','الامتحان الشامل',()=>shuffle(wordsOf(l)).slice(0,30).map((w,j)=>mkQ(w,l,TYPES[j%4])));
}

/* ---------- practice tab ---------- */
function viewPractice(){
  const l=li(),wk=S.weak[S.lang]||{},n=Object.keys(wk).length,rec=S.rec[S.lang];
  const fe=(S.exam[S.lang]||{}).final;
  app.innerHTML=`<h1>تدريب</h1><div class="cols">
  <div class="card"><b>📝 الامتحان الشامل</b><p class="muted">30 سؤال من كل الوحدات (النجاح 70%).${fe?` أفضل نتيجة: ${fe.best}%${fe.pass?' ✓':''}`:''}</p><button class="btn block" id="fx">ابدأ الامتحان</button></div>
  <div class="card"><b>🔁 مراجعة الكلمات الضعيفة</b><p class="muted">${n?`عندك ${n} كلمة تحتاج مراجعة.`:'ما عندك كلمات ضعيفة حالياً. رح نختار لك كلمات عشوائية.'}</p><button class="btn block" id="rv">ابدأ المراجعة</button></div>
  <div class="card"><b>🧭 اختبار تحديد المستوى</b><p class="muted">8 أسئلة من الأسهل للأصعب، وبنقترح عليك وحدة البداية.${rec!==undefined?`<br>توصيتك الحالية: الوحدة ${rec+1}`:''}</p><button class="btn block sec" id="pl">ابدأ الاختبار</button></div></div>`;
  $('#fx').onclick=finalExam;
  $('#rv').onclick=()=>{
    const all=wordsOf(l),byK=Object.fromEntries(all.map(w=>[w.k,w]));
    let ids=Object.keys(wk).sort((a,b)=>wk[b]-wk[a]).slice(0,8);
    if(ids.length<8){const learned=all.filter(w=>(S.prog[S.lang]||{})[w.u]&&S.prog[S.lang][w.u].learned&&!ids.includes(w.k));const pool=learned.length>=8-ids.length?learned:all.filter(w=>!ids.includes(w.k));ids=ids.concat(shuffle(pool).slice(0,8-ids.length).map(w=>w.k))}
    const qs=ids.map((k,j)=>mkQ(byK[k],l,TYPES[j%4]));
    runSession({title:'مراجعة',qs,onDone:r=>{earn(10);r.done()}})};
  $('#pl').onclick=()=>{
    const N=UNITS.length,sc=x=>Math.round(x*(N-1)/41),us=[0,6,13,20,27,34,38,41].map(sc),qs=us.map(u=>mkQ(W(l,u,Math.floor(Math.random()*UNITS[u].w.length)),l,u<N/3?'p2w':(u<2*N/3?'w2p':'type')));
    runSession({title:'نتيجة تحديد المستوى',qs,onDone:r=>{
      const fw=r.results.findIndex(x=>!x);
      const start=fw===-1?sc(36):us[fw];
      S.rec[S.lang]=start;save();
      r.done(`<p>نقترح عليك تبدأ من الوحدة <b>${start+1}</b> (${lvOf(start)}) — ${UNITS[start].t}.</p>`)}});
  };
}

/* ---------- games tab ---------- */
function viewGames(){
  const se=(S.exam[S.lang]||{}).sent;
  app.innerHTML=`<h1>ألعاب</h1><div class="cols">
  <div class="card"><b>🧩 لعبة المطابقة</b><p class="muted">طابق الصورة مع الكلمة، 6 أزواج.</p><button class="btn block" id="g1">العب</button></div>
  <div class="card"><b>⏱️ تحدي 60 ثانية</b><p class="muted">أجب على أكبر عدد ممكن. رقمك القياسي: ${S.st.best}</p><button class="btn block" id="g2">ابدأ التحدي</button></div>
  <div class="card"><b>🧱 بناء الجمل</b><p class="muted">رتّب الكلمات لتكوّن الجملة (${SENTS.length} جملة).</p><button class="btn block" id="g3">ابدأ</button></div>
  <div class="card"><b>📝 امتحان الجمل</b><p class="muted">8 جمل، النجاح 70%.${se?` أفضل نتيجة: ${se.best}%${se.pass?' ✓':''}`:''}</p><button class="btn block sec" id="g4">ابدأ الامتحان</button></div></div>`;
  $('#g1').onclick=matchGame;$('#g2').onclick=challenge;$('#g3').onclick=()=>sentenceGame({n:5});$('#g4').onclick=()=>sentenceGame({n:8,exam:true});
}
function matchGame(){
  navbar(false);pushSub();const l=li();
  const pr=S.prog[S.lang]||{};let units=Object.keys(pr).filter(u=>pr[u].learned).map(Number);if(!units.length)units=[0,1,2,3,4,5,6];
  const ws=shuffle(units.flatMap(u=>wordsOf(l,u))).slice(0,6);
  const tiles=shuffle(ws.flatMap(w=>[{k:w.k,h:w.e,emo:1,w},{k:w.k,h:`<span class="ltr">${w.t}</span>`,w}]));
  let sel=null,done=0,miss=0;
  app.innerHTML=`<div class="top2"><button class="back" id="qx" aria-label="رجوع">→ رجوع</button><b>🧩 المطابقة</b></div><div class="opts" id="mg">${tiles.map((t,i)=>`<button class="opt tile ${t.emo?'emo':''}" data-i="${i}">${t.h}</button>`).join('')}</div><p class="muted" id="mm" style="text-align:center">اختر صورة ثم كلمتها</p>`;
  $('#qx').onclick=goBack;
  app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,t=tiles[i];
    if(sel===null){sel=i;b.classList.add('sel');if(!t.emo)say(t.w.t);return}
    if(sel===i){b.classList.remove('sel');sel=null;return}
    const a=tiles[sel],ab=app.querySelector(`[data-i="${sel}"]`);
    if(a.k===t.k&&a.emo!==t.emo){
      ab.classList.add('good');b.classList.add('good');say(t.w.t);recWeak(t.w,true);
      setTimeout(()=>{ab.classList.add('gone');b.classList.add('gone')},350);sel=null;done++;
      if(done===6){S.st.match++;earn(miss?15:25);setTimeout(()=>{app.innerHTML=`<div class="card res"><div class="big">🦊🎉</div><h1>أحسنت!</h1><p>أخطاء: ${miss}</p><button class="btn block" id="back">متابعة</button><button class="btn sec block" id="again" style="margin-top:10px">🔁 العب مرة ثانية</button></div>`;$('#back').onclick=goBack;$('#again').onclick=()=>{history.replaceState(null,'');matchGame()};checkAch();save()},500)}
    }else{
      miss++;recWeak(t.w,false);ab.classList.remove('sel');ab.classList.add('shake');b.classList.add('shake');
      setTimeout(()=>{ab.classList.remove('shake');b.classList.remove('shake')},350);sel=null;
    }
  });
}
function challenge(){
  const l=li(),all=shuffle(wordsOf(l));
  const qs=all.slice(0,90).map((w,j)=>mkQ(w,l,j%2?'w2p':'p2w'));
  runSession({title:'تحدي 60 ثانية',qs,timed:60,retry:challenge,onDone:r=>{
    const sc=r.ok;let extra='';if(sc>S.st.best){S.st.best=sc;extra='<p><b>🏆 رقم قياسي جديد!</b></p>'}
    earn(sc*2);r.done(extra)}});
}
function sentenceGame(opts){
  opts=opts||{n:5};navbar(false);pushSub();const l=li();
  const ids=shuffle(SENTS.map((s,i)=>i)).slice(0,opts.n);let n=0,okc=0;
  const clean=s=>s.replace(/[.,!?؟،]/g,'').split(/\s+/).filter(Boolean);
  function show(){
    if(n>=ids.length){S.st.sent+=okc;earn(10+okc*3);
      const extra=opts.exam?examStore('sent',Math.round(okc/ids.length*100)):'';checkAch();save();
      app.innerHTML=`<div class="card res"><div class="big">🦊</div><h1>${opts.exam?'امتحان الجمل':'بناء الجمل'}</h1>${extra}<p>صحيح: <b>${okc}</b> من ${ids.length}</p><button class="btn block" id="back">متابعة</button><button class="btn sec block" id="again" style="margin-top:10px">🔁 إعادة</button></div>`;
      $('#back').onclick=goBack;$('#again').onclick=()=>{history.replaceState(null,'');sentenceGame(opts)};return}
    const row=SENTS[ids[n]],target=clean(row[1+l]),listen=n%2===1;
    let bank=shuffle(target.map((t,i)=>({t,i}))),chosen=[];
    function draw(){
      app.innerHTML=`<div class="top2"><button class="back" id="qx" aria-label="رجوع">→ رجوع</button><div class="bar" style="flex:1"><i style="width:${n/ids.length*100}%"></i></div></div>
      <div class="card q">${listen?`<div class="sub">استمع ثم رتّب الجملة</div><div style="text-align:center"><button class="btn sec" id="rp">🔊 استمع</button></div>`:`<div class="sub">ترجم إلى ${L().name}</div><div class="word">${row[0]}</div>`}
      <div class="chips area" id="ar">${chosen.map(c=>`<button class="wc" data-c="${c.i}">${c.t}</button>`).join('')}</div>
      <div class="chips" id="bk">${bank.filter(b=>!chosen.includes(b)).map(b=>`<button class="wc" data-b="${b.i}">${b.t}</button>`).join('')}</div>
      <button class="btn block" id="ck" ${chosen.length===target.length?'':'disabled'}>تحقّق</button></div>`;
      $('#qx').onclick=goBack;if($('#rp'))$('#rp').onclick=()=>say(target.join(' '));
      app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{chosen.push(bank.find(x=>x.i==b.dataset.b));draw()});
      app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x.i!=b.dataset.c);draw()});
      $('#ck').onclick=()=>{
        const good=chosen.map(c=>norm(c.t)).join(' ')===target.map(norm).join(' ');
        if(good)okc++;
        const fb=document.createElement('div');fb.className='fb '+(good?'good':'bad');
        fb.innerHTML=`<div class="in"><div><b>${good?'✓ صحيح':'✗ غير صحيح'}</b>${good?'':`<div class="ans-t ltr">${target.join(' ')}</div>`}</div><button class="btn" id="nx">متابعة</button></div>`;
        document.body.appendChild(fb);say(target.join(' '));$('#ck').disabled=true;
        $('#nx').onclick=()=>{fb.remove();n++;show()};
      };
    }
    draw();if(listen)setTimeout(()=>say(target.join(' ')),250);
  }
  show();
}

/* ---------- stats ---------- */
function viewStats(){
  const acc=S.st.ans?Math.round(S.st.ok/S.st.ans*100):0,pr=S.prog[S.lang]||{};
  let stars=0,learned=0,passed=0;for(let u=0;u<UNITS.length;u++){const p=pr[u];if(p){stars+=p.stars;if(p.learned)learned++;if(p.stars)passed++}}
  const perLv=LVN.map((n,g)=>{let s=0;for(let u=g*UPL;u<Math.min(UNITS.length,g*UPL+UPL);u++)s+=(pr[u]?pr[u].stars:0);return[n,s]});
  app.innerHTML=`<h1>إحصائيات</h1><div class="stat">
   <div class="card"><b>${S.xp}</b><span>نقاط (م${level()})</span></div><div class="card"><b>${S.streak} 🔥</b><span>أيام متتالية</span></div>
   <div class="card"><b>${acc}%</b><span>دقة الإجابات</span></div><div class="card"><b>${stars}</b><span>نجوم من ${UNITS.length*3}</span></div>
   <div class="card"><b>${learned}</b><span>وحدات تعلّمتها</span></div><div class="card"><b>${passed}</b><span>امتحانات نجحت فيها</span></div></div>
  <h2>نتائج الامتحانات</h2><div class="card">${[...LVN.map((n,g)=>['L'+g,'مستوى '+n]),['sent','الجمل'],['final','الشامل']].map(x=>{const e=(S.exam[S.lang]||{})[x[0]];return `<div class="row" style="justify-content:space-between;padding:4px 0"><span>${x[1]}</span><b style="color:${e?(e.pass?'var(--success)':'var(--danger)'):'var(--muted)'}">${e?e.best+'%'+(e.pass?' ✓':''):'—'}</b></div>`}).join('')}</div>
  <h2>التقدّم حسب المستوى</h2><div class="card">${perLv.map(x=>`<div class="row" style="margin-bottom:8px"><b style="width:30px">${x[0]}</b><div class="bar" style="flex:1"><i style="width:${x[1]/(UPL*3)*100}%"></i></div><span class="muted" style="width:42px">${x[1]}/${UPL*3}</span></div>`).join('')}</div>
  <h2>الإنجازات</h2><div class="card">${ACH.map((a,i)=>`<div class="ach ${S.ach[i]?'':'lock'}"><span class="e">${a[0]}</span><div><b>${a[1]}</b><br><small>${a[2]}</small></div></div>`).join('')}</div>
  <button class="btn sec block" id="rs">مسح كل التقدّم</button>`;
  $('#rs').onclick=()=>{if(confirm('متأكد؟ رح يتمسح كل تقدّمك.')){S=def();save();applyTheme();topbar();route()}};
}


/* ---------- grammar ---------- */
let gLv=0,gOpen=null;
function viewGram(){
  const l=L(),G=(D.gram&&D.gram[l.id])||[];S.gram=S.gram||{};
  const key=(g,i)=>l.id+':'+g+':'+i;
  const cnt=g=>G[g].filter((r,i)=>S.gram[key(g,i)]).length;
  const done=G.reduce((a,_,g)=>a+cnt(g),0);
  app.innerHTML=`<h1>📘 القواعد</h1><p class="muted">${l.name}: من A1 إلى C2، أنجزت ${done} من ${G.reduce((a,x)=>a+x.length,0)} قاعدة</p>
  <div class="gl">${LVN.map((n,g)=>`<button data-g="${g}" class="${g===gLv?'on':''}">${n}<small>${cnt(g)}/${G[g].length}</small></button>`).join('')}</div><div id="grules"></div>`;
  app.querySelectorAll('.gl button').forEach(b=>b.onclick=()=>{gLv=+b.dataset.g;gOpen=null;viewGram()});
  const box=$('#grules');
  G[gLv].forEach((r,i)=>{
    const k=key(gLv,i),open=gOpen===i,ok=S.gram[k];
    const c=document.createElement('div');c.className='card gr';
    c.innerHTML=`<button class="gh" aria-expanded="${open}"><span>${ok?'✅':'📘'}</span><span style="flex:1">${r.t}</span><span>${open?'▲':'▼'}</span></button>`;
    c.querySelector('.gh').onclick=()=>{gOpen=open?null:i;viewGram()};
    if(open){
      const b=document.createElement('div');b.className='gb';
      b.innerHTML=`<p style="margin:0 0 8px">${r.e}</p>`+r.x.map((x,j)=>`<div class="gx"><span lang="${l.id}">${x[0]} <button class="sp" data-j="${j}" aria-label="نطق">🔊</button></span><small>${x[1]}</small></div>`).join('')+
        `<div id="gqs"></div>`;
      c.appendChild(b);
      b.querySelectorAll('.sp').forEach(s=>s.onclick=()=>speak(r.x[+s.dataset.j][0],l.code));
      const M=r.m&&r.m.length?r.m:[r.q];
      M.forEach((qq,n)=>{
        const kx=k+'x'+n,blk=document.createElement('div');
        blk.innerHTML=`<div class="gq" lang="${l.id}">${M.length>1?'<small class="muted">تمرين '+(n+1)+'/'+M.length+'</small><br>':''}${qq[0].replace('___','<b>___</b>')}</div><div class="opts"></div><div class="gres"></div>`;
        const ob=blk.querySelector('.opts'),rs=blk.querySelector('.gres');
        shuffle(qq.slice(1)).forEach(o=>{const bt=document.createElement('button');bt.className='opt';bt.textContent=o;bt.style.direction='ltr';
          bt.onclick=()=>{
            if(ob.dataset.done)return;ob.dataset.done=1;
            const good=o===qq[1];
            ob.querySelectorAll('.opt').forEach(x=>{if(x.textContent===qq[1])x.classList.add('good')});
            if(!good)bt.classList.add('bad');
            rs.textContent=good?'✓ صحيح!'+(S.gram[kx]?'':' +2 نقطة'):'الإجابة الصحيحة: '+qq[1];
            if(good&&!S.gram[kx]){S.gram[kx]=1;earn(2)}
            if(M.every((_,j)=>S.gram[k+'x'+j])&&!S.gram[k]){S.gram[k]=1;earn(5);toast('✅ أتقنت القاعدة! +5')}
            S.st.ans++;if(good)S.st.ok++;save();
          };ob.appendChild(bt)});
        b.querySelector('#gqs').appendChild(blk);
      });
    }
    box.appendChild(c);
  });
}

/* ---------- install app (PWA) ---------- */
let deferredInstall=null;
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=()=>/android/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(typeof tab!=='undefined'&&S.lang&&(tab==='home'||tab==='stats')&&$('#nav').style.display!=='none')route()});
addEventListener('appinstalled',()=>{deferredInstall=null;S.installed=true;save();toast('تم تثبيت نطق ✓');if(S.lang)route()});

function installSteps(){
  if(location.protocol==='file:')return['التثبيت بيشتغل فقط لما تفتح نطق من رابط https (مثل استضافة الموقع)، مش من ملف على الجهاز.','انشر ملفات مجلد site على أي استضافة (Cloudflare Pages أو Netlify أو GitHub Pages)، وافتح الرابط من الجوال.'];
  if(isIOS())return['افتح الصفحة في Safari.','اضغط زر المشاركة ⬆️ بأسفل الشاشة.','اختر «إضافة إلى الشاشة الرئيسية».','اضغط «إضافة».'];
  if(isAndroid())return['افتح الصفحة في Chrome.','اضغط ⋮ أعلى الشاشة.','اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».'];
  return['في Chrome أو Edge: اضغط أيقونة التثبيت ⊕ في شريط العنوان.','أو من القائمة ⋮ اختر «تثبيت نطق».'];
}
function showInstallSteps(){
  const sh=document.createElement('div');sh.className='sheet';
  sh.innerHTML='<div class="in"><h2 style="margin-top:0">📲 تثبيت نطق</h2><ol class="inst-steps">'+installSteps().map(x=>'<li>'+x+'</li>').join('')+'</ol><button class="btn block sec" id="instClose" style="margin-top:12px">تمام</button></div>';
  document.body.appendChild(sh);sh.onclick=e=>{if(e.target===sh)sh.remove()};sh.querySelector('#instClose').onclick=()=>sh.remove();
}
async function doInstall(){
  if(deferredInstall){const d=deferredInstall;deferredInstall=null;d.prompt();try{const r=await d.userChoice;if(r&&r.outcome==='accepted'){S.installed=true;save()}}catch(e){}route();return}
  showInstallSteps();
}
function installCard(force){
  if(isStandalone()||S.installed)return;
  if(!force&&S.instHide===today())return;
  const c=document.createElement('div');c.className='card inst';c.id='inst';
  c.innerHTML='<b>📲 ثبّت نطق على جوالك</b><p class="muted" style="margin:6px 0 0">بأيقونة على الشاشة الرئيسية، وبيشتغل بشاشة كاملة مثل أي تطبيق.</p><div class="row2"><button class="btn" id="instBtn">تثبيت التطبيق</button>'+(force?'':'<button class="btn sec" id="instX">لاحقاً</button>')+'</div>';
  c.querySelector('#instBtn').onclick=doInstall;
  const x=c.querySelector('#instX');if(x)x.onclick=()=>{S.instHide=today();save();c.remove()};
  return c;
}
(function(){
  const vh=viewHome;viewHome=function(){vh();const c=installCard(false);if(c)app.insertBefore(c,app.firstChild)};
  const vs=viewStats;viewStats=function(){vs();const c=installCard(true);if(c)app.appendChild(c)};
})();

applyTheme();topbar();route();
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};

</script>
